# Prepared configuration; creating these services incurs hosting charges.
# Production generation remains disabled until an explicit AI allowance is configured.
services:
  - type: web
    name: alterward-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @future-flow/web build
    startCommand: pnpm --filter @future-flow/web start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
  - type: web
    name: alterward-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @future-flow/api build
    startCommand: pnpm --filter @future-flow/api start
    healthCheckPath: /health
    envVars:
      - fromGroup: alterward-server-policy
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
  - type: worker
    name: alterward-worker
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @future-flow/worker build
    startCommand: pnpm --filter @future-flow/worker start
    envVars:
      - fromGroup: alterward-server-policy
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_EVENT_MODEL
        value: gpt-6.1-sol
      - key: AI_STORY_MODEL
        value: gpt-6.1-sol
      - key: AI_CHECK_MODEL
        value: gpt-6.1-sol
      - key: AI_EXPERIMENT_LEDGER_PATH
        value: ''
envVarGroups:
  - name: alterward-server-policy
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_SSL
        value: 'true'
      - key: GENERATION_DAILY_LIMIT
        value: 3
      - key: GENERATION_CONCURRENT_LIMIT
        value: 1
      - key: AI_PROJECT_BUDGET_USD
        value: 0
      - key: AI_USER_BUDGET_USD
        value: 0
