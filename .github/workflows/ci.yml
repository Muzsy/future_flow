name: Verify main
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm docs:check
      - name: Verify backup and source archive boundaries
        run: |
          python3 -m unittest discover -s tests/ops -p 'test_*.py'
          node --test tests/ops/daily-archives.test.mjs
          node --test tests/ops/external-monitor.test.mjs
          node --test tests/ops/private-health.test.mjs
          node --test tests/ops/fence-operator.test.mjs
          node --test tests/ops/personal-beta-monitor.test.mjs
          node --test tests/ops/personal-beta-admission-observation.test.mjs
          node --test tests/ops/personal-beta-operator.test.mjs
          node --test tests/ops/reader-preparation-lifecycle.test.mjs
          node --test tests/ops/reader-archive-retry.test.mjs
          node --test tests/ops/linux-operator.test.mjs
          node --test tests/ops/recovery-local-linux.test.mjs
          node --test tests/ops/operator-transfer.test.mjs
          node --test tests/ops/funded-replay.test.mjs
          node --test tests/ops/funded-upgrade.test.mjs
          node --test tests/ops/funded-access.test.mjs
          node --test tests/ops/beta-successor-release.test.mjs
      - name: Verify root-only expired-preparation archive file contracts without services
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests/ops')
          suite = unittest.TestLoader().loadTestsFromName('test_reader_expired_archive.RootArchiveFileTests')
          result = unittest.TextTestRunner().run(suite)
          assert result.wasSuccessful() and result.testsRun == 3 and not result.skipped
          PY
      - name: Verify root-only reader file contracts without services
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import unittest
          suite = unittest.TestLoader().discover('tests/ops', pattern='test_reader_private_files.py')
          result = unittest.TextTestRunner().run(suite)
          assert result.wasSuccessful() and result.testsRun == 4 and not result.skipped
          PY
      - name: Verify root-only funded journal and archive file contracts
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests/ops')
          suite = unittest.TestLoader().loadTestsFromNames(['test_funded_upgrade.RootJournalTests', 'test_funded_upgrade.ExpiredFundedArchiveTests'])
          result = unittest.TextTestRunner().run(suite)
          assert result.wasSuccessful() and result.testsRun == 10 and not result.skipped
          PY
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify closed-site production web without live credentials
        run: node scripts/smoke-closed-site.mjs
      - run: pnpm schemas
      - run: git diff --exit-code -- docs/contracts
  container:
    runs-on: ubuntu-latest
    # Build, complete funded fixture, independent image rehearsal and cleanup.
    # The chained successor case really waits for the owner window to start.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the Contabo image without credentials
        run: >-
          docker build -t alterward:ci
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_unused
          .
      - name: Verify isolated Contabo deployment and secret boundaries
        run: node scripts/verify-deployment.mjs
      - name: Install isolated encrypted-restore fixture dependency
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Verify web, API, worker, migrations and TLS without API spending
        run: node scripts/smoke-deployment.mjs
      - name: Rehearse the actual immutable image without CI environment impersonation
        run: |
          image=$(docker image inspect alterward:ci --format '{{.Id}}')
          proof_dir="/tmp/alterward-image-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo env -i PATH=/usr/local/bin:/usr/bin:/bin python3 -B scripts/ops/contabo-funded-image-rehearsal.py --image "$image" --output-directory "$proof_dir"
          sudo install -m 644 "$proof_dir/funded-upgrade-fixture-proof.json" test-results/funded-image-fixture-proof.json
          sudo install -m 644 "$proof_dir/beta-successor-fixture-proof.json" test-results/beta-successor-fixture-proof.json
          sudo install -m 644 "$proof_dir/image-rehearsal-receipt.json" test-results/funded-image-rehearsal-receipt.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {releaseEvidence} from './scripts/lib/funded-upgrade.mjs';
          import {successorReleaseEvidence} from './scripts/lib/beta-successor-release.mjs';
          const fixture=JSON.parse(readFileSync('test-results/funded-image-fixture-proof.json','utf8'));
          const build={commit:fixture.sourceCommit,imageId:fixture.targetImage,imageTag:'alterward:contabo-aaaaaaaaaaaa',sourceDirectory:'/root/alterward-ops/synthetic-contract-check'};
          // This in-memory fixture audit exercises the validator, never authorizes a release.
          const input={commit:fixture.sourceCommit,bundleSha256:fixture.bundleSha256,selection:{target:build,recovery:build},fixture,audit:{sourceCommit:fixture.sourceCommit,bundleSha256:fixture.bundleSha256,interpretedByOperator:true,critical:0,high:0,medium:0},ci:[]};
          assert.equal(releaseEvidence(input).target.imageId,fixture.targetImage);
          assert.throws(()=>releaseEvidence({...input,selection:{target:{...build,imageId:'sha256:'+'0'.repeat(64)},recovery:build}}));
          const successorFixture=JSON.parse(readFileSync('test-results/beta-successor-fixture-proof.json','utf8'));
          const owner='22222222-2222-4222-8222-222222222222';
          const selection={purpose:'owner-e2e',previousTermsSha256:'a'.repeat(64),closePreviousAt:'2026-01-01T00:00:00Z',next:{participants:[{email:'owner@example.invalid',userId:owner}],projectUsd:'3',userUsd:'3',startsAt:'2026-01-01T00:01:00Z',endsAt:'2026-01-31T00:01:00Z'}};
          const ownerRelease={...input.selection,runtime:{mode:'narrative-fiction-v2',generation:'v9',cohortUserIds:[owner],timeoutMs:300000,maxRequestBytes:196608}};
          assert.equal(successorReleaseEvidence({...input,selection,release:ownerRelease,successorFixture}).target.imageId,fixture.targetImage);
          assert.throws(()=>successorReleaseEvidence({...input,selection,release:ownerRelease,successorFixture:{...successorFixture,sourceCommit:'f'.repeat(40)}}));
          console.log('Actual isolated image proof accepted; foreign image rejected; no release authorization.');
          JS
      - name: Retain synthetic funded upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: funded-upgrade-ci-proof
          path: test-results/funded-upgrade-ci-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain standalone image rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: funded-image-rehearsal-proof
          path: |
            test-results/funded-image-fixture-proof.json
            test-results/beta-successor-fixture-proof.json
            test-results/funded-image-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 7
