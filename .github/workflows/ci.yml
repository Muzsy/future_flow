name: Verify main
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm docs:check
      - name: Verify the production host tools and monitors
        run: |
          python3 -m unittest discover -s tests/ops -p 'test_*.py'
          node --test tests/ops/external-monitor.test.mjs
          node --test tests/ops/private-health.test.mjs
          node --test tests/ops/personal-beta-admission-observation.test.mjs
      - run: pnpm typecheck
      - name: Start a disposable local PostgreSQL for the admission concurrency proof
        run: |
          sudo systemctl start postgresql
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ff_admission_ci LOGIN SUPERUSER PASSWORD '$password'"
          sudo -u postgres createdb -O ff_admission_ci ff_admission_test
          echo "SERVICE_ADMISSION_PG_URL=postgres://ff_admission_ci:$password@127.0.0.1/ff_admission_test" >> "$GITHUB_ENV"
      - run: pnpm test
      - run: pnpm build
      - name: Verify closed-site production web without live credentials
        run: node scripts/smoke-closed-site.mjs
      - run: pnpm schemas
      - run: git diff --exit-code -- docs/contracts
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image without credentials
        run: >-
          docker build -t alterward:ci
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_unused
          .
      - name: Run the image with the production compose against a disposable TLS database
        run: bash scripts/prod/smoke-image.sh alterward:ci
  release-rehearsal:
    # Plan 055 F2d: the new host's release tool end to end with throwaway
    # images, registry and signing key (switch, refusals, automatic rollback).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse a signed release, refusals and an automatic rollback
        run: bash scripts/prod/rehearse-release.sh
