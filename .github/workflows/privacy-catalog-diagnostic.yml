name: Apply reviewed privacy catalog baseline

on:
  push:
    branches:
      - chatgpt/shared-sponsored-seats-pricing

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/shared-sponsored-seats-pricing
      - name: Apply measured PostgreSQL 17 catalog baseline and remove diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/privacy-security-catalog.ts')
          text = path.read_text()
          replacements = {
              "    710,\n    '082fee5ae303682f05770f71adaf32f5cdca476ee85505de341b3c89642d3499',": "    712,\n    '3dade33d6532215bb2f8be3e5825db305898e77bf0904bb8a69f27bff36479bb',",
              "    250,\n    '995a4dd5054f77715249929558a2be05c4f4acc9b45ace3744194e1a07449f70',": "    251,\n    '6b72fda111964ded453fac450b9f2c5a6ed5708ba2079a2b83c4bf5ccd4e2a3e',",
              "    854,\n    '7cff5af0a7d2c5f6f8577bb761acd12c9053690fd2790e8d3f8d8c74e074e1f5',": "    855,\n    '14d330c4c1bd7a2aacbfa26bc86ccbaeeabaa9000980089e27592cb07aaa9759',",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one baseline occurrence: {old[:20]}')
              text = text.replace(old, new)
          path.write_text(text)
          Path('.github/workflows/privacy-catalog-diagnostic.yml').unlink()
          PY
          git diff --check
          git diff -- scripts/lib/privacy-security-catalog.ts .github/workflows/privacy-catalog-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib/privacy-security-catalog.ts .github/workflows/privacy-catalog-diagnostic.yml
          git commit -m 'test: refresh reviewed privacy catalog for sponsored guest schema'
          git push origin HEAD:chatgpt/shared-sponsored-seats-pricing
