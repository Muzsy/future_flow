name: Prettier diagnostic

on:
  push:
    branches:
      - chatgpt/shared-sponsored-seats-pricing

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write tests/shared-sponsored-guest.test.ts
          git diff -- tests/shared-sponsored-guest.test.ts
          test -z "$(git status --short tests/shared-sponsored-guest.test.ts)"
